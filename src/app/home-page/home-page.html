<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>ManualFoxStudio - Home</title>
</head>

<body>
    <header class="flex flex-row justify-between items-center px-4 md:px-8 py-4 bg-gray-900">
        <!-- Logo un poco más pequeño en móvil (w-36) y normal en PC (md:w-48) -->
        <img src="assets/LOGO LETRAS CON IAnofondo.png" alt="Logo del estudio" class="w-66 md:w-68 cursor-pointer"
            routerLink="/">
    </header>

    <!-- Añadido px-4 para que la caja negra no toque los bordes de la pantalla en el móvil -->
    <main
        class="h-screen w-full bg-[url('/assets/fondo_home.jpg')] bg-cover bg-center flex items-center justify-center px-4">

        <!-- En móvil va en columna (flex-col) y en PC en fila (md:flex-row) -->
        <div
            class="flex flex-col md:flex-row items-center gap-4 md:gap-6 bg-black/60 p-6 md:px-10 md:py-8 rounded-2xl text-center">

            <!-- Texto mediano en móvil (text-3xl) y gigante en PC (md:text-6xl) -->
            <h1 class="text-3xl md:text-6xl text-white font-bold">Bienvenido a</h1>

            <!-- Logo adaptado en móvil (w-56) y grande en PC (md:w-80) -->
            <img src="assets/LOGO LETRAS CON IAnofondo.png" alt="Logo del estudio" class="w-56 md:w-80">
        </div>

    </main>
</body>

</html>
