<header class="flex flex-row justify-between items-center px-4 md:px-8 py-4 bg-gray-900">
    <img src="assets/LOGO LETRAS CON IAnofondo.png" alt="Logo del estudio" class="w-36 md:w-48 cursor-pointer" routerLink="/">

    <!-- Botones para cambiar de idioma al vuelo -->
    <div class="flex gap-2">
        <button (click)="i18n.cambiarIdioma('es')" class="px-3 py-1 rounded bg-gray-800 text-white hover:bg-gray-700 cursor-pointer">
            🇪🇸 ES
        </button>
        <button (click)="i18n.cambiarIdioma('en')" class="px-3 py-1 rounded bg-gray-800 text-white hover:bg-gray-700 cursor-pointer">
            🇬🇧 EN
        </button>
    </div>
</header>

<!-- min-h-screen permite hacer scroll y bg-fixed hace que el fondo quede fijo de forma brutal -->
<main class="min-h-screen w-full bg-[url('/assets/fondo_home.jpg')] bg-cover bg-center bg-fixed flex flex-col items-center px-4">

    <!-- 1ª Pantalla: ocupa todo el alto inicial (h-screen) y centra el cartel -->
    <div class="flex-col h-screen flex items-center justify-center">
        <div class="flex flex-col md:flex-row items-center gap-4 md:gap-6 bg-black/60 p-6 md:px-10 md:py-8 rounded-2xl text-center">
            <h1 class="text-3xl md:text-6xl text-white font-bold">{{i18n.t.bienvenido}}</h1>
            <img src="assets/LOGO LETRAS CON IAnofondo.png" alt="Logo del estudio" class="w-56 md:w-80">
        </div>
        <h1 class="text-2xl md:text-5xl text-white font-bold">{{i18n.t.eslogan}}</h1>
    </div>

    <!-- 2ª Parte (aparece al hacer scroll hacia abajo): pb-32 deja espacio abajo -->
    <div class="flex flex-col items-center bg-black/60 p-8 rounded-2xl mb-32 max-w-3xl text-center">
        <h2 class="text-2xl md:text-4xl text-white font-bold mb-4">{{i18n.t.quienesSomos}}</h2>
        <p class="text-white text-lg">{{i18n.t.historia}}</p>
    </div>

</main>
